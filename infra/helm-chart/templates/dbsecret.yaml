
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "HyFive.fullname" . }}-db
  labels:
    {{- include "HyFive.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER:  {{ .Values.postgres.credentials.username }}
  POSTGRES_PASSWORD: {{ default .Values.postgres.credentials.password (randAlphaNum 32) }}
  POSTGRES_DB: {{ .Values.postgres.credentials.dbname }}
{{- if .Values.postgres.deploy }}
  POSTGRES_HOST: {{ include "HyFive.fullname" . }}-db.{{ .Release.Namespace }}.svc.cluster.local
{{- else }}
  POSTGRES_HOST: {{ .Values.postgres.credentials.hostname }}
{{- end }}
