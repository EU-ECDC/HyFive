apiVersion: v1
kind: Service
metadata:
  name: {{ include "HyFive.fullname" . }}-admin
  labels:
    {{- include "HyFive.adminLabels" . | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "HyFive.adminSelectorLabels" . | nindent 4 }}
