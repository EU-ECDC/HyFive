
<app-offline-message (hasInternetEvent)="isOnline = $event"></app-offline-message>
<div class="container" *ngIf='isOnline'>
  <app-navigation-link (linkClicked)="navigateToSentSessions()">{{"Back" | translate }}</app-navigation-link>
  <app-session-edit-header [session]="session" [header]="'Sent sessions - Bare Below Elbows' | translate"></app-session-edit-header>
</div>

<div class="container" *ngIf='isOnline'>
  <div class="accordion-compact mb-4">
    <app-accordion [items]="session?.observations"
                   [headerTemplate]="header"
                   [contentTemplate]="content">
    </app-accordion>
    <ng-template #header let-item="item">
      <div>
        <p class="mb-1"><strong>{{ item.role.name }} - {{ item.registeredTime | date:'HH:mm' }}</strong></p>
        <p class="mb-0 lh-1"><small>{{ showHandJewelry(item.handJewelries) }}</small></p>
      </div>
    </ng-template>
    <ng-template #content let-item="item">
      <div>
        <app-edit-hand-jewelry-observation [observation]="item"
                                             [department]="session?.department"
                                             [isReadonly]="true">
        </app-edit-hand-jewelry-observation>
      </div>
    </ng-template>
  </div>
  <div class="row" *ngIf="session?.comment" style="font-size: 17px;">
    <div class="col-12">
      <p>{{"Comment" | translate}}: <small><strong data-hj-suppress>{{session.comment}}</strong></small></p>
    </div>
  </div>
  <div class="text-end" *ngIf="session?.observations?.length > 0">
    <button  class="btn fhi-btn-icon" (click)="downloadAsExcelFnct()" >
      <i class="icon-download"></i>
      {{DialogueTexts.DownloadDataAsExcel | translate}}
    </button>
    <app-spinner *ngIf="downloadAsExcel"></app-spinner>
  </div>
</div>
