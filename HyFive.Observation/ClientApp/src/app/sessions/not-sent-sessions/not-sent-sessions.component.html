<div class="container d-xl-none pb-3 mt-n5">
  <h1 class="h2">{{"Sessions" | translate}}</h1>
</div>

<div class="container px-0">
  <app-session-overview>
    <div class="mb-3">
      <button
        class="btn fhi-btn-secondary me-3 mb-2"
        [disabled]="sessions.length < 1"
        (click)="markAllSessions()"
      >
        {{"Select all" | translate}}
      </button>
      <button
        class="btn fhi-btn-primary mb-2"
        [disabled]="!hasSelectedASession"
        (click)="sendSelectedSessionsToServer()"
      >
        {{"Send selected" | translate}}
      </button>
    </div>
    <div class="row">
      <div class="col-lg-8 mb-4">
        <div class="d-flex">
          <label class="icon-search mt-2 me-3" for="search-unsent-items"
            ><span class="visually-hidden">{{"Filter list" | translate}}</span></label
          >
          <input
            id="search-unsent-items"
            type="search"
            class="form-control"
            [placeholder]="'Search for...' | translate"
            [(ngModel)]="keyword"
            (ngModelChange)="filterSessions()"
          />
        </div>
      </div>
    </div>
      <div class="row p-3">
      <mat-paginator *ngIf="totalItems > 0"
        [length]="totalItems"
        [pageSize]="pageSize"
        [showFirstLastButtons]="true"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)">
      </mat-paginator>
      </div>
    <div class="row">
      <div
        class="col-12 col-md-6 col-lg-4 col-xxl-3 mb-3 mb-md-5"
        *ngFor="let sessionView of sessionsFiltered; index as i"
      >
        <div class="fhi-card h-100">
          <div class="form-check mb-2">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              [id]="'chk_' + i"
              [(ngModel)]="sessionView.isSelected"
              (click)="markSession(sessionView)"
            />
            <label class="form-check-label" [for]="'chk_' + i">{{"Select for submission" | translate}}</label>
          </div>

          <h2 class="h4 mb-0">{{ sessionView.facilityName }}</h2>
          <p class="mb-0">{{"Dep" | translate}}: {{ sessionView.departmentName }}</p>
          <p>{{'Unit' | translate}}: {{sessionView.unitName}}</p>
          <p class="small">{{ sessionNameMap.get(sessionView.type) }}</p>

          <div class="mb-2 text-muted small">
            <i class="icon-calendar icon-sm align-top"></i>
            {{ sessionView.startDate | date : "dd.MM.yyyy HH:mm:ss" }}
          </div>

          <div class="text-end mt-auto">
            <a
              class="btn fhi-btn-shortcut-link mb-n2"
              [routerLink]="['/' + getSessionTypeUrl(sessionView.type)]"
              [queryParams]="{ sessionId: sessionView.id }"
            >
              <span class="btn__text">{{"See details" | translate}}</span>
              <i class="icon-arrow-right me-0 ms-2"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
    <app-offline-message
      (hasInternetEvent)="isOnline = $event"
      [darkMode]="true"
    ></app-offline-message>
  </app-session-overview>
</div>
