<div class="container hh-observations-during-work mb-3">
  <div class="row">
    <div class="col">
      <div class="d-flex align-items-center">
        <div class="hh-observations-during-work__work-header">
          <h1 class="h3">
            {{header}}
          </h1>
          <p>
             <i class="icon-clipboard2 icon-lg me-1"></i>
            <span *ngIf="sessionIsSentToServer === false">(Work in progress)</span>
          </p>
          
          <div *ngIf="session" class="hh-observations-during-work__time row d-flex">
            <div class="col-auto"><i class="icon-clock icon-sm me-1"></i> {{ session.createdDate | date:'HH:mm' }} </div>
            <div class="col"><i class="icon-calendar icon-sm me-1"></i> {{ session.createdDate | date:'dd.MM.yyyy' }} </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
