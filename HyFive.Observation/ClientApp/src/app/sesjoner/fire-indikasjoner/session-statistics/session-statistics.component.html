<div class="mb-5" *ngIf="session">
  <div class="container">
    <table class="table table-sm w-100">
      <thead>
        <tr>
          <td class="w-75"></td>
          <th class="text-end">Number</th>
          <th class="text-end">Percentage</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>Opportunities observed</th>
          <td class="text-end">{{ calculateOpportunitiesComplied() }}</td>
          <td class="text-end">{{ calculateOpportunitiesCompliedPercent().toFixed(2)  }}</td>
        </tr>
        <tr>
          <th>Opportunities omitted</th>
          <td class="text-end">{{ calculateOpportunitiesOmitted() }}</td>
          <td class="text-end">{{ calculateOpportunitiesOmittedPercent().toFixed(2) }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
