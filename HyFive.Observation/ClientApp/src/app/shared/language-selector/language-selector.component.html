<div class="col-md-2 flex flex-column justify-content-center w-100">
  <label class="d-block text-center" for="sessionType">{{"Select Language" | translate}}</label>
  <ng-select
      [placeholder]="'language' | translate"
      [clearable]="false"
      [items]="availableLanguages"
      bindLabel="label"
      bindValue="code"
      [(ngModel)]="selectedLanguage.code"
      (ngModelChange)="changeLanguage()"
      >
  </ng-select>
</div>
