<div class="hh-modal">
  <ng-container *ngIf="selectedEquipment">
    <div class="modal-header">
      <h4 class="d-flex align-items-center">
        <fa-stack>
          <fa-icon [icon]="faCircle" stackItemSize="2x" [styles]="{ 'color': '#DBE6EC' }"></fa-icon>
          <fa-icon [icon]="iconTypeMap.get(selectedEquipment.equipmentType.code)" [inverse]="true" [styles]="{ 'color': '#000000' }" stackItemSize="1x"></fa-icon>
        </fa-stack>
        <span class="modal-title" id="modal-basic-title">
          {{selectedEquipment.equipmentType.name}}
        </span>
      </h4>
      <button type="button" class="btn-close" aria-label="Close" (click)="dismiss()"></button>
    </div>

    <div class="modal-content">
      <div class="modal-body">
        <div class="form-check mb-2">
          <input class="form-check-input"
                 type="radio"
                 name="correctUse"
                 id="correctUse"
                 [disabled]="displayMode"
                 [value]="true"
                 [(ngModel)]="selectedEquipment.wasUsedCorrectly"
                 (click)="resetIncorrectUseAndMarkUsed(true)">
          <label class="form-check-label" for="correctUse">{{"Correct use" | translate}}</label>
        </div>
        <div class="form-check">
          <input class="form-check-input"
                 type="radio"
                 name="correctUse"
                 id="incorrectUse"
                 [disabled]="displayMode"
                 [value]="false"
                 [(ngModel)]="selectedEquipment.wasUsedCorrectly"
                 (click)="resetIncorrectUseAndMarkUsed(false)">
          <label class="form-check-label" for="incorrectUse">{{"Incorrect use" | translate }}</label>
        </div>
        
        <div class="mt-2" *ngIf="selectedEquipment.wasUsedCorrectly === false">
          <ng-container *ngIf="!displayMode">
            <p class="lh-1">
              <small>
                <strong>{{"Select at least one of the options below, or fill in a comment" | translate}}</strong>
              </small>
            </p>
            <ng-container *ngFor="let fb of selectedEquipment.equipmentType.misuseTypes">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox"[id]="fb.name" [(ngModel)]="fb.isSelected" [disabled]="displayMode">
                <label class="form-check-label" [for]="fb.name">
                  {{fb.name}}
                </label>
              </div>              
            </ng-container>
          </ng-container>
          <ng-container *ngIf="displayMode">
            <ng-container *ngFor="let fb of selectedEquipment.misuseTypes">
              <div class="form-check mb-2">
                <input type="checkbox" class="form-check-input" [id]="fb.name" [disabled]="true" [checked]="true">
                <label class="form-check-label" [for]="fb.name">
                  {{fb.name}}
                </label>
              </div>
            </ng-container>
          </ng-container>
          <div class="form-group mt-n3" *ngIf="displayMode == false">
            <label for="FormInput"></label>
            <input type="text" id="FormInput" class="form-control" [placeholder]="'Add comment...' | translate" [(ngModel)]="selectedEquipment.comment">
          </div>
          <div class="mt-3" *ngIf="displayMode && selectedEquipment.comment">
            <span data-hj-suppress>{{"Comment" | translate}}: <i>{{selectedEquipment.comment}}</i></span>
          </div>
        </div>
      </div>
      <div class="modal-footer d-flex justify-content-center">
        <div class="col">
          <button type="button" *ngIf="showEquipmentDeleteButton && selectedEquipment.wasUsed" class="btn btn-sm fhi-btn-primary flex-grow p-1" (click)="dismiss()">{{"Delete equipment" | translate}}</button>
        </div>
        <div class="col">
          <button type="button" class="btn" [ngClass]="displayMode ? 'fhi-btn-shortcut-link' : 'fhi-btn-primary'" (click)="close()" [disabled]="!canSave()">
            <span *ngIf="!displayMode">{{"Save answer" | translate}}</span>
            <i class="icon-arrow-left icon-red" *ngIf="displayMode"></i>
            <span class="btn__text" *ngIf="displayMode">{{"Back to card" | translate}}</span>
          </button>
        </div>
      </div>
    </div>
  </ng-container>
</div>
