<div class="hh-observasjonsteller">
  <a class="hh-observasjonsteller__link"
     [routerLink]="numberOfObservations() > 0 ? ['/' + url] : []"
     [queryParams]="{ sessionId: sessionsdata?.id }">
    <fa-layers [fixedWidth]="true" size="2x">
      <fa-icon class="hh-observasjonsteller__obs-card" [icon]="faObservasjonskort"></fa-icon>
      <fa-icon class="hh-observasjonsteller__circle" [inverse]="false" [icon]="faCircle" transform="shrink-2 down-0 right-9" content="2"></fa-icon>
      <fa-layers-text class="hh-observasjonsteller__text" content="{{numberOfObservations()}}" transform="shrink-8 down-0.8 right-9"></fa-layers-text>
    </fa-layers>
  </a>
</div>
<app-hjelpetekst *ngIf="numberOfObservations() > 0" [tittel]="'Tips og triks - Redigere og sende inn observations'">
  <p>
    Oppe til venstre finnes det et ikon - en notatblokk with et tall. Tallet representerer antall observations du har executed.
    Ved å klikke på notatblokka vil du kunne se på og redigere observasjonene dine før innsending, samt sende inn dine observations.
  </p>

</app-hjelpetekst>
