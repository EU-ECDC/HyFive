<div class="hh-card-slider">

  <app-lagre-skygge [show]="showSaveShadow"></app-lagre-skygge>

  <div [id]="card.id"
       class="hh-card-slider__card"
       [ngClass]="{ 'hh-card-slider__card--active': card.isActive }"
       [style.transform]="transform"
       [@swipeLeftRight]="animation"
       (panmove)="onPanMove($event)"
       (panend)="onPanEnd($event)"
       (click)="cardIsSelected()"
       [ngStyle]="card.isActive && {'background-color': colors.getFhiColorHexFromText(card.role.name)}">

    <div class="row">

      <div class="col-12">
        <app-rolle-valg-dropdown *ngIf="roleSelected" [rolleId]="card.role.id" [roleSelected]="roleSelected" (roleSelected)="selectRole($event)"></app-rolle-valg-dropdown>

        <div class="mt-3 text-break">
          <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" (activeIdChange)="nullstillFane()" class="nav-tabs nav-justified hh-hanske-tabs">
            <li ngbNavItem="with">
              <a ngbNavLink class="hh-hanske-tabs__tab">
                Glove ved indication
              </a>
              <ng-template ngbNavContent>
                <div class="row py-1 px-3" *ngFor="let type of gloveWithIndicationTypes">
                  <div class="col-auto hh-hanske-tabs__label-td">
                    <label class="form-check-label" [for]="type.code">
                      <fa-icon [icon]="faHandPaper" class="fa-2x me-2"></fa-icon>
                      <strong>{{type.name}}</strong>
                    </label>
                  </div>
                  <div class="col text-end pt-1">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" value="" [id]="type.code" [(ngModel)]="type.isSelected">
                    </div>
                  </div>
                </div>

                <div class="row p-3 pb-2">
                  <div class="col">
                    <div class="d-flex">
                      <div class="d-flex flex-column justify-content-center">
                        <p class="mb-0 me-2">Glove brukt?</p>
                      </div>

                      <div class="ms-auto">
                        <div class="btn-group fhi-btn-group" role="group">
                          <input type="radio" class="btn-check fhi-btn-group__check" name="name-{{uuid}}" id="btn-ja-{{uuid}}"  [value]="true" [(ngModel)]="hanskeBenyttet" />
                          <label class="btn fhi-btn-group__btn" for="btn-ja-{{uuid}}">Yes</label>
                          
                          <input type="radio" class="btn-check fhi-btn-group__check" name="name-{{uuid}}" id="btn-nei-{{uuid}}" [value]="false"[(ngModel)]="hanskeBenyttet" />
                          <label class="btn fhi-btn-group__btn" for="btn-nei-{{uuid}}">No</label>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </ng-template>
            </li>
            <li ngbNavItem="uten">
              <a ngbNavLink class="hh-hanske-tabs__tab">
                Glove uten indication
              </a>
              <ng-template ngbNavContent>
                <div class="row py-1 px-3" *ngFor="let type of gloveWithoutIndicationTypes">
                  <div class="col-aitp hh-hanske-tabs__label-td">
                    <label class="form-check-label" [for]="type.code">
                      <fa-icon [icon]="faHandPaper" class="fa-2x me-2"></fa-icon>
                      <strong>{{type.name}}</strong>
                    </label>
                  </div>
                  <div class="col text-end pt-1">
                    <div class="form-check mt-2">
                      <input class="form-check-input" type="checkbox" value="" [id]="type.code" [(ngModel)]="type.isSelected">
                    </div>
                  </div>
                </div>
              </ng-template>
            </li>
          </ul>
          <div [ngbNavOutlet]="nav" class="mt-2 w-100"></div>

          <div class="mt-3" *ngIf="sessionView.gloveUseMustBeRegistered && hanskeBenyttet">
            <h3 class="h5 text-center">Håndhygiene etter hanskebruk?</h3>
            <div class="d-flex">
              <div class="mx-auto btn-group fhi-btn-group btn-group-vertical">
                <ng-container *ngFor="let type of handHygieneAfterGloveUseTypes">
                  <input type="radio" class="btn-check fhi-btn-group__check" id="btnradio-{{type.name}}-{{uuid}}" name="hanskebruk-name-{{uuid}}" [value]="type.code" [(ngModel)]="valgtHandhygieneEtterHanskebruk" />
                  <label class="btn fhi-btn-group__btn" for="btnradio-{{type.name}}-{{uuid}}">{{type.name}}</label>
                </ng-container>
              </div>
            </div>
          </div>
        </div>

        <div class=" d-flex flex-row mt-2 justify-content-around">
          <app-register-comment [commentInput]="comment"
                                   (commentRegisteredEvent)="registerComment($event)">
          </app-register-comment>
          <button type="button" class="hh-transparent-button hh-transparent-button hh-transparent-button--small p-0" (click)="resetCard()">
            <span class="d-flex align-items-center"><fa-icon class="mr-1" [icon]="faEraser"></fa-icon>Empty card</span>
          </button>
        </div>
      </div>

    </div>

  </div>

  <app-slett-skygge [show]="showDeleteShadow"></app-slett-skygge>

  <app-info-modal [modalText]="observationDeficiencyText" [showInfoModal]="showInfoModal" (closeInfoModalEvent)="closeInfoModal($event)"></app-info-modal>

</div>
