<div class="hh-card-slider">

  <app-lagre-skygge [vis]="showSaveShadow"></app-lagre-skygge>

  <div [id]="card.id"
       class="hh-card-slider__card"
       [ngClass]="{ 'hh-card-slider__card--active': card.isActive }"
       [style.transform]="transform"
       [@swipeLeftRight]="animation"
       (panmove)="onPanMove($event)"
       (panend)="onPanEnd($event)"
       (click)="kortErValgt()"
       [ngStyle]="card.isActive && {'background-color': colors.getFhiColorHexFromText(card.role.name)}">

    <div class="d-flex flex-row">
      <div class="d-flex flex-column justify-content-start">
        <app-rolle-valg-dropdown *ngIf="roleSelected" [rolleId]="card.role.id" [roleSelected]="roleSelected" (rolleValgt)="velgRolle($event)"></app-rolle-valg-dropdown>

        <app-indikasjonsvalg (indikasjonsValgChangedEvent)="indikasjonsValgChanged($event)"
                             [erAktiv]="card.isActive"
                             [parentId]="card.id">
        </app-indikasjonsvalg>

        <div class="row mt-n3" *ngIf="activity?.timeSpent > 0">
          <div class="col-12 text-center mb-2 mt-4">
            <button class="btn hh-transparent-button hh-transparent-button--small" (click)="fjernTidsregistrering()">
              <span class="d-flex align-items-center"><fa-icon [icon]="faTrashAlt"></fa-icon>  Fjern tidsregistrering</span>
            </button>
          </div>
        </div>
        <div class=" d-flex flex-row mt-2 justify-content-around">
          <app-registrer-kommentar [kommentarinput]="comment"
                                   (kommentarRegistertEvent)="registrerKommentar($event)">
          </app-registrer-kommentar>
          <button type="button" class="hh-transparent-button hh-transparent-button hh-transparent-button--small p-0" (click)="nullstillKort()">
            <span class="d-flex align-items-center"><fa-icon class="mr-1" [icon]="faEraser"></fa-icon>Tøm card</span>
          </button>
        </div>
      </div>
      <div class="d-flex flex-column justify-content-center">
        <div class="d-flex justify-content-around">
          <div class="hh-vertical-stadium-buttons">
            <div class="hh-vertical-stadium-buttons__button">
              <app-registrer-aktivitet [deaktivert]="skalAktivitetDeaktiveres(ActivityTypeConstants.Desinfeksjon)"
                                       [erRegistrert]="erRegistrert(ActivityTypeConstants.Desinfeksjon)"
                                       [parentId]="card.id"
                                       [seconds]="activity?.timeSpent"
                                       [tidtaking]="sessionView.timeShouldBeRegistred"
                                       [activityType]="getAktivitetType(ActivityTypeConstants.Desinfeksjon)"
                                       [bekreftelseModalSkalVises]="sessionView.gloveUseMustBeRegistered"
                                       [icon]="faHandHoldingWater"
                                       (aktivitetRegistertEvent)="registrerAktivitet($event)">
              </app-registrer-aktivitet>
            </div>
            <div class="hh-vertical-stadium-buttons__button">
              <app-registrer-aktivitet [deaktivert]="skalAktivitetDeaktiveres(ActivityTypeConstants.Handvask)"
                                       [erRegistrert]="erRegistrert(ActivityTypeConstants.Handvask)"
                                       [parentId]="card.id"
                                       [seconds]="activity?.timeSpent"
                                       [tidtaking]="sessionView.timeShouldBeRegistred"
                                       [activityType]="getAktivitetType(ActivityTypeConstants.Handvask)"
                                       [bekreftelseModalSkalVises]="sessionView.gloveUseMustBeRegistered"
                                       [icon]="faHandsWash"
                                       (aktivitetRegistertEvent)="registrerAktivitet($event)">
              </app-registrer-aktivitet>
            </div>
            <div class="hh-vertical-stadium-buttons__button pt-0">
              <app-registrer-aktivitet [deaktivert]="skalAktivitetDeaktiveres(ActivityTypeConstants.NotExecuted)"
                                      [erRegistrert]="erRegistrert(ActivityTypeConstants.NotExecuted)"
                                      [parentId]="card.id"
                                      [activityType]="getAktivitetType(ActivityTypeConstants.NotExecuted)"
                                      [bekreftelseModalSkalVises]="sessionView.gloveUseMustBeRegistered"
                                      [icon]="faTimesCircle"
                                      (aktivitetRegistertEvent)="registrerAktivitet($event)">
              </app-registrer-aktivitet>
            </div>
          </div>
        </div>

      </div>

    </div>

  </div>

  <app-slett-skygge [vis]="showDeleteShadow"></app-slett-skygge>

  <app-info-modal [modalTekst]="observasjonMangelTekst" [visInfoModal]="visInfoModal" (lukkInfoModalEvent)="closeInfoModal($event)"></app-info-modal>
</div>
