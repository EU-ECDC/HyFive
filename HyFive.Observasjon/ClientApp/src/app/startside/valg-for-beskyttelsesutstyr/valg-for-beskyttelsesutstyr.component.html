<div class="container">
  <ng-container *ngIf='!valgtSetting'>
    <div class="row mb-5">
      <div class="col">
        <h4 class="mb-4">Verneutstyr</h4>
        <div (click)='endreValgtSetting(setting)' class="hh-beskyttelsesutstyrsetting d-flex px-2 justify-content-between align-items-center" *ngFor='let setting of settinger'>
          <p class="mb-1 mx-3 font-weight-bold">{{setting.name}}</p>
          <div>
            <fa-stack size="lg">
              <fa-icon [icon]="faCircle" stackItemSize="2x" [ngStyle]="{'color': '#DBE6EC'}"></fa-icon>
              <fa-icon [icon]="beskyttelsesutstyrsettingMapper.getIconTypeMap().get(setting.code)" stackItemSize="1x"></fa-icon>
            </fa-stack>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf='valgtSetting'>
    <!--  På lenken under burde det muligens ikke stå "Til beskyttelsesutstyr" men heller "Select setting".
    Enn så lenge lar vi den stå, da det står "Til beskyttelsesutstyr" i skissen.
    -->
    <app-navigation-link (linkClicked)="valgtSetting = null">For protective equipment </app-navigation-link>
    <div class="d-flex align-items-center mb-5">
      <div>
        <fa-stack size="lg">
          <fa-icon [icon]="faCircle" stackItemSize="2x" [ngStyle]="{'color': '#DBE6EC'}"></fa-icon>
          <fa-icon [icon]="beskyttelsesutstyrsettingMapper.getIconTypeMap().get(valgtSetting.code)" stackItemSize="1x"></fa-icon>
        </fa-stack>
      </div>
      <div>
        <h5>{{valgtSetting.name}}</h5>
      </div>
    </div>
    <div class="row ml-5">
      <div class="col">
        <p><strong>Required verneutstyr</strong></p>
        <div class="custom-control custom-checkbox mb-3" *ngFor='let equipment of valgtSetting.equipmentTypes'>
          <input type='checkbox' [id]="'equipment' + equipment.id" [(ngModel)]="equipment.isRequired" class="form-check-input me-3">
          <label class="custom-control-label" [htmlFor]="'equipment' + equipment.id">
            {{equipment.name}}
          </label>
        </div>
      </div>
    </div>
    <div class='d-flex justify-content-center'>
      <button *ngIf="sessionView == null" class='btn fhi-btn-primary text-center' (click)='startObservasjon()'>Start observation</button>
      <button *ngIf="sessionView != null" class='btn fhi-btn-primary text-center' (click)='endreSettingOgUtstyr()'>Fortsett observation</button>
    </div>
    <app-help-text [title]="'Tips og triks for valg av predefinert verneutstyr for '+valgtSetting.name">
      <p>Du har valgt {{valgtSetting.name}}. Det er forhåndsdefinert hva som er required verneutstyr for dette smitteregimet.<br /> Du kan fjerne eller legge til required verneutstyr ved å hake av i listen.</p>
    </app-help-text>
  </ng-container>
</div>
