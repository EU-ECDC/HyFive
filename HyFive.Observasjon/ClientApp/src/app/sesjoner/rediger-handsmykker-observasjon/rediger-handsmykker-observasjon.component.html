<div class="hh-card-slider">
  <div class="d-flex flex-column">
    <div class="d-flex justify-content-between" *ngIf="isReadonly == false">
      <div class="mb-3">
        <button *ngIf="!isEditMode" class="btn fhi-btn-icon" (click)="isEditMode = true">
          <i class="icon-pencil"></i>
          Edit
        </button>
        <button *ngIf="isEditMode" class="btn fhi-btn-icon" (click)="saveObservation()">
          <i class="icon-check-circle"></i>
          Save
        </button>
      </div>
      <div class="mr-3">
        <app-slett-bekreftelsesdialog [erSvartFarge]="false" (slettetEvent)="deleteObservation()"
                                      [dialogmelding]="DialogueTexts.ObservationDeleteConfirmation">
          <fa-icon [icon]="faTrashAlt"></fa-icon> Delete
        </app-slett-bekreftelsesdialog>
      </div>
    </div>
    <div class="hh-card-slider__card"
         [ngClass]="{ 'hh-card-slider__card--active': isEditMode || isReadonly }"
         [ngStyle]=" (isEditMode || isReadonly) && {'background-color': Colors.getFhiColorHexFromText(observation.role.name)}">

      <div class="row pt-3 pb-0">
        <div class="col-12">
          <ng-container *ngIf="isEditMode">
            <app-role-selection-dropdown [rolleId]="observation.role.id"
                                     [isReadonly]="isReadonly"
                                     [roleSelectedI]="department.roles"
                                     (roleSelectedEvent)="roleSelected($event)">
            </app-role-selection-dropdown>
          </ng-container>
        </div>
      </div>
      <div class="row text-break" *ngIf="handJewelrySelection?.length">
        <div class="col-4 col-md-3 text-center mb-3 pt-3" *ngFor="let valg of handJewelrySelection; let i = index;">
          <label [htmlFor]="observation.id.substr(4)+i" [ngStyle]="{ 'opacity': valg.disabled ? '0.5' : '1' }">
            <input [disabled]="isReadonly || !isEditMode || valg.disabled"
                   type="checkbox"
                   [(ngModel)]="valg.isSelected"
                   (ngModelChange)="changed(valg)"
                   [id]="observation.id.substr(4)+i"
                   class="hh-round-checkbox-list__input">
            <fa-stack class="hh-round-checkbox-list__iconstack">
              <fa-icon [icon]="faCircle"
                       stackItemSize="2x"
                       class="hh-round-checkbox-list__circle"
                       [ngClass]="{'hh-round-checkbox-list__circle--chosen': valg.isSelected, 'hh-round-checkbox-list__circle--active': isEditMode}"></fa-icon>
              <fa-icon [icon]="iconTypeMap.get(valg.type)" [styles]="{ 'color': 'black' }" [inverse]="true" stackItemSize="1x" *ngIf="!valg.isSelected"></fa-icon>
              <fa-icon [icon]="faCheck" [inverse]="true" [styles]="{ 'color': '#333841' }" stackItemSize="1x" *ngIf="valg.isSelected"></fa-icon>
            </fa-stack>
            <br />
            <span><small><strong>{{ valg.name }}</strong></small></span>
          </label>
        </div>
      </div>
      <div class="row mt-n3">
        <div class="col">
          <div class="d-flex flex-row justify-content-around">
            <ng-container *ngIf="isEditMode">
              <app-register-comment [disabled]="isReadonly"
                                       [commentInput]="observation.comment"
                                       (commentRegisteredEvent)="registerComment($event)">
              </app-register-comment>
            </ng-container>
            <ng-container *ngIf="!isEditMode && observation.comment">
              <label><small>Comment: <strong data-hj-suppress>{{observation.comment}}</strong></small></label>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
