<div class="container">
  <app-navigation-link (linkClicked)="navigerTilRegistreringssideForBeskyttelsesutstyr(sesjon.id)">Tilbake til observation</app-navigation-link>
  <app-sesjonsredigering-overskrift [sesjon]="sesjon" [overskrift]="'Session: Verneutstyr'" [sesjonErSendtTilServer]="sesjonErSendtTilServer"></app-sesjonsredigering-overskrift>
</div>
<div class="container" *ngIf="sesjonErSendtTilServer == false">
  <div class="accordion-compact mb-4">
    <app-accordion [items]="sesjon.observations"
                   [headerTemplate]="header"
                   [contentTemplate]="content">
    </app-accordion>
    <ng-template #header let-item="item">
      <div>
        <p class="mb-1"><strong>{{ item.role.name }} - {{ item.registrationTime | date:'HH:mm' }}</strong></p>
        <p class="mb-1">{{ item.settingtype.name }}</p>
        <p class="mb-0"><small>{{ visUtstyr(item.protectiveEquipmentList) }}</small></p>
      </div>
    </ng-template>
    <ng-template #content let-item="item">
      <app-rediger-beskyttelsesutstyr-observasjon [observation]="item"
                                                  [department]="sesjon.department"
                                                  [institutionid]="institutionid"
                                                  (observasjonSlettetEvent)="observasjonSlettetEventHandler($event)">
      </app-rediger-beskyttelsesutstyr-observasjon>
    </ng-template>
  </div>

  <div class="row mb-6">
    <div class="col-12">
      <div class="form-group">
        <input type="text" id="FormInput" class="form-control" placeholder="Add comment"
               [(ngModel)]="sesjon.comment"
               (ngModelChange)="sessionService.updateSession(sesjon)">
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <app-offline-melding (harInternettEvent)="isOnline = $event"></app-offline-melding>
    </div>
  </div>
  <app-spinner *ngIf="sesjonSendesTilServer"></app-spinner>
  <div class="row mb-4" *ngIf="!sesjonSendesTilServer">
    <div class="col ms-auto mb-3">
      <app-slett-bekreftelsesdialog (slettetEvent)="sesjonSlettetEventHandler(sesjon.id)" [dialogmelding]="DialogueTexts.SessionDeleteConfirmation" [erSvartFarge]="false">
        <i class="icon-trash3"></i>
        Delete sesjon
      </app-slett-bekreftelsesdialog>
    </div>
    <div class="col-auto text-end ms-auto" *ngIf="isOnline">
      <button class="btn fhi-btn-primary"
              (click)="sendTilKoordinator()"
              [disabled]="!(sesjon?.observations?.length > 0)">
        Send til koordinator
      </button>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col">
      <app-navigation-link [mobileCssClass]="'override--noeffect'" (linkClicked)="navigerTilRegistreringssideForBeskyttelsesutstyr(sesjon.id)">Tilbake til observation</app-navigation-link>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col">
      <button class="btn fhi-btn-outline-primary" (click)="navigerTilSendteSesjoner()" style="color: #5E8A9C;">
        Send sessions
      </button>
    </div>
  </div>
</div>

<div class="container" *ngIf="sesjonErSendtTilServer">
  <div class="row">
    <p>{{DialogueTexts.SessionIsSentToCoordinator}}<a [routerLink]="navigerTilSendtSesjon()">{{DialogueTexts.ShowSubmittedSession}}</a></p>
  </div>
</div>
