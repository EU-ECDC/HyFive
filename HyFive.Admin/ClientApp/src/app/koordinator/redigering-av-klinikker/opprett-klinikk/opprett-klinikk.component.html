<div class="row">
  <h5 class="col-12 mt-2">Create klinikk</h5>
  <div class="col-12 col-lg-6">
    <div class="form-row">
      <div class="form-group col-12 mb-3">
        <label for="klinikknavn">Name</label>
        <input type="text" id="klinikknavn" class="form-control" placeholder="e.g. Medisinsk klinikk" [(ngModel)]="nyKlinikk.name">
      </div>
      <div class="form-group col-12 mb-3">
        Departments som skal være tilknyttet klinikken
        <div class="custom-control custom-checkbox my-1" *ngFor="let valg of avdelingsvalg">
          <input type="checkbox" [(ngModel)]="valg.erValgt" [id]="'role'+avdelingsvalg.indexOf(valg)" class="form-check-input">
          <label [htmlFor]="'role'+avdelingsvalg.indexOf(valg)" class="custom-control-label ms-2">
            <span>{{ valg.avdeling.name }}</span>
          </label>
          <fa-icon *ngIf="valg.erAlleredePaKlinikk" [icon]="fawarningicon" class="mx-1 fa-icon-warning" ngbTooltip="Brukes av en annen klinikk!"></fa-icon>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="row col-3">
  <button class="btn fhi-btn-primary ms-3 mt-1" [disabled]="kanIkkeOppretteKlinikk()" (click)="opprettKlinikk()">Create klinikk</button>
</div>
