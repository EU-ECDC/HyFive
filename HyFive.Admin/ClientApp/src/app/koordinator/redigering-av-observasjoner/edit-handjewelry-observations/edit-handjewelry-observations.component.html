<ng-container>
  <div class="table-responsive">
    <table class="table mb-0">
      <thead>
        <tr>
          <th>Role</th>
          <th>Handsmykke(r)</th>
          <th>Registrert</th>
          <th>Kommentar</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let observasjon of observasjoner">
          <tr (click)="velgObservasjon(observasjon)" *ngIf="handjewelryObservationAsChanged?.id !== observasjon.id">
            <td>{{observasjon.rolle.name}}</td>
            <td>
              <ul style="padding-left: 20px;">
                <li *ngFor="let ht of observasjon.handsmykketyper">
                  {{ht.name}}
                </li>
              </ul>
            </td>
            <td>{{observasjon.registrerttidspunkt | date:'dd.MM.yyyy HH:mm' }}</td>
            <td>{{observasjon.kommentar}}</td>
          </tr>
          <ng-container *ngIf="handjewelryObservationAsChanged && handjewelryObservationAsChanged.id === observasjon.id">
            <tr>
              <td colspan="12">
                <i>ID: {{observasjon.id}}</i>
              </td>
            </tr>
            <tr></tr>
            <tr>
              <td><app-role-selection-dropdown [roleId]="handjewelryObservationAsChanged.rolle.id" [departmentId]="avdeling.id" (roleSelected)="velgRolle($event)" [customClass]="''"></app-role-selection-dropdown></td>
              <td>
                <ul *ngFor="let hsv of handsmykkeValg">
                  <div class="form-check">
                    <input [checked]="hsv.erValgt" (change)="hsv.erValgt = !hsv.erValgt" class="form-check-input" type="checkbox" id="customCheck{{hsv.type}}">
                    <label class="form-check-label" for="customCheck{{hsv.type}}">
                      {{hsv.name}}
                    </label>
                  </div>
                </ul>
              </td>
              <td>
                {{handjewelryObservationAsChanged.registrerttidspunkt | date:'dd.MM.yyyy HH:mm' }}
              </td>
              <td>
                <textarea style="width: 12rem;" [(ngModel)]="handjewelryObservationAsChanged.kommentar" (ngModelChange)="endretKommentar($event)">{{handjewelryObservationAsChanged.kommentar}}</textarea>
              </td>
            </tr>
            <tr></tr>
            <tr>
              <td colspan="12" class="col-12">
                <div class="form-row">
                  <div class="col mt-3">
    
                    <app-bekreftelsesdialog
                                          [knappTekst]="'Lagre'" 
                                          [buttonClass]="'btn fhi-btn-primary me-3'"
                                          (bekreftetEvent)="updateHandJewelryObservation()"
                                          [dialogmelding]="'Er du sikker på at du vil lagre endringer på observasjon med id ' + observasjon.id + '?'">
                    </app-bekreftelsesdialog>
                    <app-bekreftelsesdialog 
                                          [knappTekst]="'Slett'"
                                          [buttonClass]="'btn fhi-btn-secondary me-3'"
                                          (bekreftetEvent)="deleteHandJewelryObservation()" 
                                          [dialogmelding]='"Vil du slette observasjon med id: " + observasjon.id + "?"'>
                    </app-bekreftelsesdialog>
                    <button class="btn fhi-btn-primary bg-dark me-3"
                            (click)="avbrytRedigeringAvObservasjon($event)">
                      Avbryt
                    </button>
                  </div>
                </div>
              </td>
            </tr>
          </ng-container>
    
        </ng-container>
    
      </tbody>
    </table>
    
  </div>
</ng-container>
