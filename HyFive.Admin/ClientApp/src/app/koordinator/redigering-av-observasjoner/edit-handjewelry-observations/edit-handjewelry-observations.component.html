<ng-container>
  <div class="table-responsive">
    <table class="table mb-0">
      <thead>
        <tr>
          <th>Role</th>
          <th>Handsmykke(r)</th>
          <th>Registrert</th>
          <th>Kommentar</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let observation of observations">
          <tr (click)="velgObservasjon(observation)" *ngIf="handjewelryObservationAsChanged?.id !== observation.id">
            <td>{{observation.role.name}}</td>
            <td>
              <ul style="padding-left: 20px;">
                <li *ngFor="let ht of observation.typesOfHandJewelry">
                  {{ht.name}}
                </li>
              </ul>
            </td>
            <td>{{observation.registrationTime | date:'dd.MM.yyyy HH:mm' }}</td>
            <td>{{observation.comment}}</td>
          </tr>
          <ng-container *ngIf="handjewelryObservationAsChanged && handjewelryObservationAsChanged.id === observation.id">
            <tr>
              <td colspan="12">
                <i>ID: {{observation.id}}</i>
              </td>
            </tr>
            <tr></tr>
            <tr>
              <td><app-role-selection-dropdown [roleId]="handjewelryObservationAsChanged.role.id" [departmentId]="department.id" (roleSelected)="velgRolle($event)" [customClass]="''"></app-role-selection-dropdown></td>
              <td>
                <ul *ngFor="let hsv of handsmykkeValg">
                  <div class="form-check">
                    <input [checked]="hsv.erValgt" (change)="hsv.erValgt = !hsv.erValgt" class="form-check-input" type="checkbox" id="customCheck{{hsv.type}}">
                    <label class="form-check-label" for="customCheck{{hsv.type}}">
                      {{hsv.name}}
                    </label>
                  </div>
                </ul>
              </td>
              <td>
                {{handjewelryObservationAsChanged.registrerttidspunkt | date:'dd.MM.yyyy HH:mm' }}
              </td>
              <td>
                <textarea style="width: 12rem;" [(ngModel)]="handjewelryObservationAsChanged.comment" (ngModelChange)="endretKommentar($event)">{{handjewelryObservationAsChanged.comment}}</textarea>
              </td>
            </tr>
            <tr></tr>
            <tr>
              <td colspan="12" class="col-12">
                <div class="form-row">
                  <div class="col mt-3">
    
                    <app-confirmation-dialog
                                          [buttonText]="'Lagre'" 
                                          [buttonClass]="'btn fhi-btn-primary me-3'"
                                          (confirmEvent)="updateHandJewelryObservation()"
                                          [dialogMessage]="'Er du sikker på at du vil lagre endringer på observation med id ' + observation.id + '?'">
                    </app-confirmation-dialog>
                    <app-confirmation-dialog 
                                          [buttonText]="'Slett'"
                                          [buttonClass]="'btn fhi-btn-secondary me-3'"
                                          (confirmEvent)="deleteHandJewelryObservation()" 
                                          [dialogMessage]='"Vil du slette observation med id: " + observation.id + "?"'>
                    </app-confirmation-dialog>
                    <button class="btn fhi-btn-primary bg-dark me-3"
                            (click)="avbrytRedigeringAvObservasjon($event)">
                      Avbryt
                    </button>
                  </div>
                </div>
              </td>
            </tr>
          </ng-container>
    
        </ng-container>
    
      </tbody>
    </table>
    
  </div>
</ng-container>
