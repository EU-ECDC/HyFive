<div class="container">
  <div class="row">
    <div class="row align-items-end mb-4">

      <div class="col-md-2">
        <label for="sessionType">Intervall</label>
        <select class="form-select" id="rolle" [(ngModel)]="intervall">
          <option value="maned">Måned</option>
          <option value="tertial">Tertial</option>
          <option value="uke">Uke</option>
        </select>
      </div>

      <div class="col-md-2" *ngIf="intervall=='uke'">
        <label for="fra">Fra måned</label>
        <select class="form-select" id="maned" [(ngModel)]="fromMonth">
          <option *ngFor="let maned of maneder" [ngValue]="maned.value">{{maned.description}}</option>
        </select>
      </div>

      <div class="col-md-2">
        <label for="fra">Fra år</label>
        <input class="form-control" id="fromYear" type="number" [(ngModel)]="fromYear" />
      </div>

      <div class="col-md-2" *ngIf="intervall=='uke'">
        <label for="fra">Til måned</label>
        <select class="form-select" id="maned" [(ngModel)]="toMonth">
          <option *ngFor="let maned of maneder" [ngValue]="maned.value">{{maned.description}}</option>
        </select>
      </div>

      <div class="col-md-2">
        <label for="til">Til år</label>
        <input class="form-control" id="toYear" type="number" [(ngModel)]="toYear" />
      </div>
    </div>
  </div>
  <div class="row">
    <div class="row align-items-end mb-4">

      <div class="col-md-2">
        <label for="sessionType">Role</label>
        <select class="form-select" id="rolle" [(ngModel)]="rolle">
          <option value="null">All</option>
          <option *ngFor="let rolle of roles" [ngValue]="rolle">{{rolle.name}}</option>
        </select>
      </div>

      <div class="col-md-2">
        <label for="sessionType">Department</label>
        <select class="form-select" id="avdeling" [(ngModel)]="avdeling">
          <option value="null">All</option>
          <option *ngFor="let avdeling of departments" [ngValue]="avdeling">{{avdeling.name}}</option>
        </select>
      </div>

      <div class="form-group col-12 col-md-3">
        <label style="opacity:0;">-</label>
        <br />
        <button class="btn btn-sm fhi-btn-primary me-2" (click)="getComplianceForFourIndications()">Vis graf</button>
      </div>
    </div>
  </div>

  <div class="row" *ngIf="visGraf">
    <div class="col-8">
      <fhi-angular-highcharts [diagramOptions]="prosentDiagramOptions"></fhi-angular-highcharts>
    </div>
  </div>

  <div class="row" *ngIf="visGraf">
    <div class="col-8">
      <fhi-angular-highcharts [diagramOptions]="antallDiagramOptions"></fhi-angular-highcharts>
    </div>
  </div>
</div>
