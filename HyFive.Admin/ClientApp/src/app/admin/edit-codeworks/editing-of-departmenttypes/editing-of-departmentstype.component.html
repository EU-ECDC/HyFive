<div>
  <div class="row ms-1">
    <div class="col">
      <h5>{{"Department types" | translate}}</h5>
    </div>
  </div>
  
  <div class="row ms-1">
    <div class="col-3">
      <input type="text" autocomplete="off" class="form-control" [(ngModel)]='newDepartmentType.code' (ngModelChange)="newDepartmentType.code = $event.trim()" [placeholder]="'Code' | translate">
    </div>
    <div class="col-3">
      <input type="text" autocomplete="off" class="form-control" [(ngModel)]='newDepartmentType.name' (ngModelChange)="newDepartmentType.name = $event.trim()" [placeholder]="'Name' | translate">
    </div>
    <div class="col-6">
      <button class="form-control btn fhi-btn-primary" (click)="createDepartmentType()" [disabled]="!newDepartmentType.code || !newDepartmentType.name">{{"Add to" | translate}}</button>
    </div>
  </div>

  <div class="col-12 m-3">
    <ng-container>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>{{"Code" | translate }}</th>
              <th>{{"Name" | translate }}</th>
              <th class="text-end" scope="col">{{"Action" | translate }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let departmentType of departmentTypes">
              <ng-container *ngIf="departmentTypeAsChanged?.id !== departmentType.id">
                <td>{{departmentType.code}}</td>
                <td>{{departmentType.name}}</td>
                <td class="text-end py-2 align-middle">
                  <button class="btn fhi-btn-icon" (click)="selectedDepartmentType(departmentType)">
                    <i class="icon-pencil"></i><span class="btn__text">{{"Edit" | translate }}</span>
                  </button>
                </td>
              </ng-container>
              <ng-container *ngIf="departmentTypeAsChanged?.id === departmentType.id">
                <td>{{departmentTypeAsChanged.code}}</td>
                <td>
                  <input type="text" autocomplete="off" class="form-control" [(ngModel)]="departmentTypeAsChanged.name" (ngModelChange)="departmentTypeAsChanged.name = $event.trim()">
                </td>
                <td class="text-end py-2 align-middle">
                  <button class="btn fhi-btn-icon" (click)="updateDepartmentType(departmentTypeAsChanged)">
                    <i class="icon-pencil"></i><span class="btn__text">{{"Save" | translate }}</span>
                  </button>
                  <button class="btn fhi-btn-icon" (click)="cancelEdit($event)">
                    <i class="icon-x"></i><span class="btn__text">{{"Cancel" | translate }}</span>
                  </button>
                </td>
              </ng-container>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>
  </div>
</div>
<div class="row">
  <app-spinner class="col-12" *ngIf="departmentTypes?.length == 0">{{"Loading Department Types" | translate}}</app-spinner>
</div>
