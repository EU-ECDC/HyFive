<div class="container">

  <!-- Filter -->
  <div class="row">
    <div class="row align-items-end mb-4">
      <div class="col-md-2">
        <label for="sessionType">Session Type</label>
        <ng-select
            [searchable]="false"
            placeholder="All"
            [clearable]="false"
            [items]="sessiontypes"
            bindLabel="name"
            bindValue="value"
            [(ngModel)]="selectedSessiontype"
            (ngModelChange)="resetSearchresults()"
            >
        </ng-select>
      </div>
      <div class="col-md-2">
        <label for="fra">From date</label>
        <input id="fra" class="form-control" id="fromDate" type="date" [(ngModel)]="fromDate" (ngModelChange)="resetSearchresults()" [max]="toDate || null" />
      </div>
      <div class="col-md-2">
        <label for="to">To date</label>
        <input id="to" class="form-control" id="toDate" type="date" [(ngModel)]="toDate" (ngModelChange)="resetSearchresults()" [min]="fromDate || null" />
      </div>
      <div *ngIf="canSelectFacility" class="col-md-3">
        <label for="facilities">Facility</label>
        <ng-select
          [searchable]="false"
          placeholder="All"
          [clearable]="false"
          [items]="facilities"
          bindLabel="name"
          bindValue="id"
          [(ngModel)]="selectedFacilityId"
          (ngModelChange)="resetSearchresults()"
          >
        </ng-select>
      </div>
      <div style="display: flex;" class="form-group col-12 col-md-3">
        <label style="opacity:0;">-</label>
        <br />
        <button class="btn btn-sm fhi-btn-primary me-2" (click)="getFacilitiesWithSessions()">Search</button>
        <button class="btn btn-sm fhi-btn-secondary ms-2" (click)="reset()">Clear filters</button>
      </div>
    </div>
  </div>

  <div class="row" *ngIf="searching">
    <app-spinner class="col-12">Searching...</app-spinner>
  </div>

  <!-- Search result -->
  <div class="row mb-5" *ngIf="facilityOverviewReportList.length">
    <app-accordion class="col-12"
                   [items]="facilityOverviewReportList"
                   [headerTemplate]="headerFacilityOverviewReport"
                   [contentTemplate]="contentFacilityOverviewReport"
                   (shownEvent)="findId($event)">
    </app-accordion>

    <ng-template #headerFacilityOverviewReport let-item="item">
      {{item.name}}. Sessions: {{item.numberOfSessions}}. Observations: {{item.numberOfObservations}}.
    </ng-template>

    <ng-template #contentFacilityOverviewReport let-item="item">
      <h5>Departments</h5>
      <ng-container>
        <div class="table-responsive">
          <table class="table" sortable-table (sorted)="sort($event)">
            <thead>
              <tr>
                <th sortable-column="Name"></th>
                <th>Number of sessions</th>
                <th>Number of observations</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let department of item.departments">
                <td>{{department.name}}</td>
                <td>{{department.numberOfSessions}}</td>
                <td>{{department.numberOfObservations}}</td>
                <td class="py-2">
                  <button class="btn fhi-btn-icon"
                          (click)="navigateToObservationsForTheDepartment(department)"
                          [disabled]="department.numberOfSessions === 0">
                    View sessions
                    <fa-icon [icon]="faArrowRight"></fa-icon>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </ng-container>
    </ng-template>

  </div>
</div>
