<div class="col-12">
    <div class="form-group col-5 mb-3">
        <label for="firstName">{{"First Name" | translate }}</label>
        <input type="text" autocomplete="off" class="form-control" id="firstName" [(ngModel)]="newAdmin.firstName" (ngModelChange)="newAdmin.firstName = $event.trim()" (keypress)="omitSpecialChar($event)" name="firstName" [placeholder]="'First name' | translate">
      </div>
    <div class="form-group col-5 mb-3">
        <label for="lastName">{{"Last Name" | translate }}</label>
        <input type="text" autocomplete="off" class="form-control" id="lastName" [(ngModel)]="newAdmin.lastName" (ngModelChange)="newAdmin.lastName = $event.trim()" (keypress)="omitSpecialChar($event)" name="lastName" [placeholder]="'Last name' | translate">  
    </div>
    <div class="form-group col-5 mb-3">
        <label for="email">{{"Email" | translate }}</label>
        <input type="email" autocomplete="off" class="form-control" id="email" [(ngModel)]="newAdmin.email" (keypress)="mailValidatorHelper.validateMailCharacters($event)" name="email" [placeholder]="'Email' | translate">
    </div>
</div>
<div class="row">
  <div class="col-md-3">
    <button class="btn fhi-btn-primary w-100 mt-1" [disabled]="canCreate() == false" (click)="createAdmin()">{{"Save" | translate}}</button>
  </div>
  <div class="col-md-3">
    <button class="btn fhi-btn-secondary mt-1 me-3"
            (click)="cancelEdit()">
      {{ "Cancel" | translate }}
    </button>
  </div>
</div>
