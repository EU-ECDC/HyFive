<div class="row">
  <div class="col-12 col-lg-6">
    <div class="form-row">
      <div class="form-group col-12 mb-3">
        <label for="unitname">{{"Name" | translate }}</label>
        <input type="text" autocomplete="off" id="unitname" class="form-control" [placeholder]="'e.g. Medical Unit' | translate" (keypress)="omitSpecialChar($event)" [(ngModel)]="newUnit.name" (ngModelChange)="newUnit.name = sanitizeUnitName($event)">
      </div>
      <div class="form-group col-12 mb-3">
        {{"Departments to be associated with the unit" | translate}}
        <div class="custom-control custom-checkbox my-1" *ngFor="let selection of departmentsSelection">
          <input type="checkbox" [(ngModel)]="selection.isSelected" [id]="'role'+departmentsSelection.indexOf(selection)" class="form-check-input">
          <label [htmlFor]="'role'+departmentsSelection.indexOf(selection)" class="custom-control-label ms-2">
            <span>{{ selection.department.name }}</span>
          </label>
          <fa-icon *ngIf="selection.isAlreadyAtUnit" [icon]="faInfoIcon" class="mx-1 fa-icon-warning" ngbTooltip="Used by another Unit!"></fa-icon>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-3">
    <button class="btn fhi-btn-primary w-100 mt-1" [disabled]="canNotCreateUnit()" (click)="createUnit()">{{"Save" | translate}}</button>
  </div>
  <div class="col-md-3">
    <button class="btn fhi-btn-secondary mt-1 me-3"
            (click)="cancelForm()">
      {{ "Cancel" | translate }}
    </button>
</div>
</div>
