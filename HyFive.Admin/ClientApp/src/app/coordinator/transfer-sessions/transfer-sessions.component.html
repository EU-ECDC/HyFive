<div class="container transfer-sessions-width" style="margin-bottom: 125px;">
    <div class="row">
        <div class="flex-row row flex-wrap flex-xxl-nowrap align-items-end justify-content-center">
          
          <div class="form-group col col-md-2">
            <label for="observer">{{ "Observer" | translate }}</label>
            <ng-select
              [searchable]="false"
              [clearable]="false"
              [placeholder]="'All' | translate"
              [items]="observers"
              bindLabel="firstLast"
              bindValue="id"
              [(ngModel)]="selectedObserver"
              (ngModelChange)="resetSearchresults()"
              >
            </ng-select>
          </div>
          <div class="form-group col col-md-1" style="min-width: 180px;"> 
            <label for="sessionType">{{ "Session Type" | translate }}</label>
            <ng-select
              [searchable]="false"
              [clearable]="false"
              [placeholder]="'All' | translate"
              [items]="sessionTypeOptions"
              bindLabel="name"
              bindValue="value"
              [(ngModel)]="selectedSessiontype"
              (ngModelChange)="resetSearchresults()"
              >
            </ng-select>
          </div>

          <div class="form-group col col-md-2" style="min-width: 263px;">
            <label for="transferStatus">{{ "Session Status" | translate }}</label>
            <ng-select
              [searchable]="false"
              [clearable]="false"
              [placeholder]="'All' | translate"
              [items]="transferStatusOptions"
              bindLabel="name"
              bindValue="value"
              [(ngModel)]="selectedTransferStatus"
              (ngModelChange)="resetSearchresults()">
            </ng-select>
          </div>

          <div class="form-group col col-md-1 w-auto px-1">
            <button class="btn btn-sm fhi-btn-primary px-2" (click)="getSessions()">{{ "Search" | translate }}</button>
          </div>
          <div class="form-group col col-md-1 w-auto" px-1>
            <button class="btn btn-sm fhi-btn-secondary px-2" (click)="reset()">{{ "Clear Filters" | translate }}</button>
          </div>
          <div class="row w-auto mt-4 px-1">
            <div class="form-group col w-auto flex-grow-0 px-1">
              <button style="background-color: transparent !important; color: #4f841a;" 
                      class="btn fhi-btn-link" 
                      [disabled]="sessionsCoordinator.length < 1" 
                      (click)="markAllSessions()">
                      {{ allSessionsSelected ? ('Unselect all sessions' | translate)
                      : ('Select all sessions' | translate) }}
              </button>
            </div>
            <div class="form-group col col-md-2 px-1">
              <button class="btn fhi-btn-link" style="background-color: transparent !important; color: #4f841a;" [disabled]="!hasSelectedAtLeastOneSession()" (click)="transferSessions()">{{ "Transfer selected sessions" | translate }}</button>
            </div>
          </div>
        </div>
      </div>
  </div>

  <app-spinner *ngIf="loading"></app-spinner>

  <div class="container mt-5" *ngIf="!loading && SearchDone && !sessions.length">
    <div class="row">
      <div class="col text-center">
        {{"No sessions found." | translate}}
      </div>
    </div>
  </div>

  <div class="container transfer-sessions-width-table" *ngIf="sessions.length">

    <div class="row my-2">
      <div class="col">
        <h3>{{"Not Transferred sessions" | translate }}</h3>
        <span *ngIf="SearchDone && !sessionsCoordinator.length">
          {{"No sessions ready for submission." | translate}}
        </span>
      </div>
    </div>

    <app-overview-sessions-view [session]="sessionsCoordinator"
                                   [isTransferOverview]="true"
                                   (transferEvent)="transfer($event)"
                                   (observationUpdatedEvent)="getSessions()"
                                   (observationDeletedEvent)="getSessions()">
    </app-overview-sessions-view>

  </div>


  <div class="container transfer-sessions-width-table" style="margin-top: 125px;" *ngIf="sessionsFHI.length">
    <div class="row mb-2 my-7">
      <div class="col">
        <h3>{{"Transferred sessions" | translate}}</h3>
      </div>
    </div>

    <app-overview-sessions-view [session]="sessionsFHI"
                                   [isTransferOverview]="true">
    </app-overview-sessions-view>
  </div>
  <div class="row" *ngIf="loading">
    <app-spinner class="col-12">{{"Loading sessions" | translate}}</app-spinner>
  </div>
