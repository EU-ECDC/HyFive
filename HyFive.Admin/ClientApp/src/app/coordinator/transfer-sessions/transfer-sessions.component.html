<div class="container">
    <div class="row">
        <div class="row align-items-end">
          
          <div class="form-group col col-md-3">
            <label for="observer">Observer</label>
            <ng-select
              [searchable]="false"
              [clearable]="false"
              placeholder="All"
              [items]="observers"
              bindLabel="firstLast"
              bindValue="id"
              [(ngModel)]="selectedObserver"
              (ngModelChange)="resetSearchresults()"
              >
            </ng-select>
          </div>
          <div class="form-group col col-md-2">
            <label for="sessionType">Session type</label>
            <ng-select
              [searchable]="false"
              [clearable]="false"
              placeholder="All"
              [items]="sessionTypeOptions"
              bindLabel="name"
              bindValue="value"
              [(ngModel)]="selectedSessiontype"
              (ngModelChange)="resetSearchresults()"
              >
            </ng-select>
          </div>

          <div class="form-group col-12 col-md-1 px-0">
            <button class="btn btn-sm fhi-btn-primary me-2" (click)="getSessions()">Search</button>
          </div>
          <div style="position: relative; left: 25px;" class="form-group col-12 col-md-2 px-0">
            <button class="btn btn-sm fhi-btn-secondary" (click)="reset()">Clear filters</button>
          </div>
          
          <div class="form-group col col-md-2">
            <label style="opacity:0;">-</label>
            <button style="background-color: transparent !important; color: #4f841a;" class="btn btn-md fhi-btn-link" [disabled]="sessionsCoordinator.length < 1" (click)="markAllSessions()">Select all sessions</button>
          </div>

          <div class="form-group col col-md-2">
            <label style="opacity:0;">-</label>
            <button class="btn fhi-btn-link" style="background-color: transparent !important; color: #4f841a;" [disabled]="!hasSelectedAtLeastOneSession()" (click)="transferSessions()">Transfer selected sessions</button>
          </div>
        </div>
      </div>
  </div>

  <app-spinner *ngIf="loading"></app-spinner>

  <div class="container mt-5" *ngIf="!loading && SearchDone && !sessions.length">
    <div class="row">
      <div class="col text-center">
        No sessions found.
      </div>
    </div>
  </div>

  <div class="container" *ngIf="sessions.length">

    <div class="row my-2">
      <div class="col">
        <h5>Sessions</h5>
        <span *ngIf="SearchDone && !sessionsCoordinator.length">
          No sessions ready for submission.
        </span>
      </div>
    </div>

    <app-overview-sessions-view [session]="sessionsCoordinator"
                                   [isTransferOverview]="true"
                                   (transferEvent)="transfer($event)"
                                   (observationUpdatedEvent)="getSessions()"
                                   (observationDeletedEvent)="getSessions()">
    </app-overview-sessions-view>

  </div>


  <div class="container" *ngIf="sessionsFHI.length">
    <div class="row mb-2">
      <div class="col">
        <h5>Transferred sessions</h5>
      </div>
    </div>

    <app-overview-sessions-view [session]="sessionsFHI"
                                   [isTransferOverview]="true">
    </app-overview-sessions-view>
  </div>
  <div class="row" *ngIf="loading">
    <app-spinner class="col-12">Loading sessions</app-spinner>
  </div>
