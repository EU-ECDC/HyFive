<div class="language-selector-container">
  <label for="sessionType">{{"Select Language" | translate}}</label>
  <ng-select
      placeholder="language"
      [clearable]="false"
      [items]="availableLanguages"
      bindLabel="label"
      bindValue="code"
      [(ngModel)]="selectedLanguage.code"
      (ngModelChange)="changeLanguage()"
      >
  </ng-select>
</div>
