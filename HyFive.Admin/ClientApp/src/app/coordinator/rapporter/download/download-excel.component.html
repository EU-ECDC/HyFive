<div class="container">
  <h4>Downloading data for a healthcare facility or department on Excel-format</h4>
  <div class="row mt-4" *ngIf="canSelectFacility">
    <div class="col-md-5">
      <label for="facility">Healthcare facilities</label>
      <div #dropdownRef>
        <ng-multiselect-dropdown placeholder="Select healthcare facilities"
                                [settings]="dropdownSettings"
                                [data]="facilities"
                                [(ngModel)]="selectedFacilities"
                                (ngModelChange)="onChangeModelFacility()">
        </ng-multiselect-dropdown>
      </div>
    </div>
  </div>
  <div class="row mt-4">
    <div class="custom-control custom-checkbox">
      <input type="checkbox" [(ngModel)]="createFacilityReport" class="form-check-input" (ngModelChange)="selectCreateFacilityReport()">
      <label class="custom-control-label ms-2">Download for healthcare facility</label>
    </div>
  </div>
  <div class="row mt-4 mb-2">
    <div class="col-md-5" [class.dropdown-disabled]="createFacilityReport">
      <label for="department">Departments</label>
      <ng-multiselect-dropdown [placeholder]="'Select departments'"
                              [disabled]="createFacilityReport"
                              [settings]="dropdownSettings"
                              [data]="departments"
                              [(ngModel)]="selectedDepartments">
      </ng-multiselect-dropdown>
    </div>
    <div class="col-md-3">
      <label for="sessionType">Module</label>
      <ng-select
          [searchable]="false"
          [clearable]="false"
          [items]="sessionTypes"
          bindLabel="name"
          bindValue="value"
          [(ngModel)]="selectedSessiontype"
          >
        </ng-select>
    </div>
  </div>
  <div class="row mb-4">
    <div class="col-md-3">
      <label for="fromDate">From date</label>
      <input class="form-control" id="fromDate" type="date" [(ngModel)]="fromDate" [max]="toDate || null" />
    </div>
    <div class="col-md-3">
      <label for="toDate">To date</label>
      <input class="form-control" id="toDate" type="date" [(ngModel)]="toDate" [min]="fromDate || null" />
    </div>
  </div>
  <div class="row mt-4">
    <div class="form-group col-12">
      <button class="btn btn-sm fhi-btn-primary me-2" (click)="saveReport()" [disabled]="!canCreateReport()">Download file</button>
      <button class="btn btn-sm fhi-btn-secondary ms-2" (click)="reset()">Clear filters</button>
    </div>
  </div>

  <div class="row" *ngIf="storedReport">
    <app-spinner class="col-2"></app-spinner>
  </div>

</div>
