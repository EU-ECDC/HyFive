<div  class="col-12 col-lg-10">
  <div class="row mb-3">
    <div class="form-group col-6">
        <label for="firstName">{{"First Name" | translate }}</label>
        <input type="text" autocomplete="off" class="form-control" id="firstName" (keypress)="omitSpecialChar($event)" [(ngModel)]="newCoordinator.firstName" (ngModelChange)="newCoordinator.firstName = $event.trim()" name="firstName" [placeholder]="'First name' | translate">
    </div>
    <div class="form-group col-6">
        <label for="lastName">{{"Last Name" | translate }}</label>
        <input type="text" autocomplete="off" class="form-control" (keypress)="omitSpecialChar($event)" [(ngModel)]="newCoordinator.lastName" (ngModelChange)="newCoordinator.lastName = $event.trim()" id="lastName" name="lastName" [placeholder]="'Last name' | translate">
    </div>
  </div>
  <div class="row mb-3">
    <div class="form-group col-6">
        <label for="email">{{"Email" | translate }}</label>
        <input type="email" autocomplete="off" class="form-control" id="email" (keypress)="mailValidatorHelper.validateMailCharacters($event)" [(ngModel)]="newCoordinator.email" name="email" [placeholder]="'Email' | translate">
    </div>
    <div class="form-group col-6">
        <label for="Facilities">{{"Facilities" | translate }}</label>
        <ng-multiselect-dropdown [placeholder]="'Select' | translate"
                                    id="Facilities"
                                    [settings]="dropdownSettings"
                                    [data]="facilitiesCity"
                                    [(ngModel)]="newCoordinator.facilities">
        </ng-multiselect-dropdown>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-3">
    <button class="btn fhi-btn-primary w-100 mt-1" [disabled]="canCreate() == false" (click)="createCoordinator()">{{"Save" | translate}}</button>
  </div>
  <div class="col-md-3">
    <button class="btn fhi-btn-secondary mt-1 me-3"
            (click)="cancelEdit()">
      {{ "Cancel" | translate }}
    </button>
</div>
</div>
