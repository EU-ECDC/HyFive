<div>
  <div class="row">
    <div class="col">
      <h5>Glove With Indication Types</h5>
    </div>
  </div>

  <div class="col-12 m-3">
    <ng-container>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th class="text-end" scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let gloveWithIndicationType of gloveWithIndicationTypes">
              <ng-container *ngIf="gloveWithIndicationTypeAsChanged?.id !== gloveWithIndicationType.id">
                <td>{{gloveWithIndicationType.code}}</td>
                <td>{{gloveWithIndicationType.name}}</td>
                <td class="text-end py-2 align-middle">
                  <button class="btn fhi-btn-icon" (click)="selectedGloveWithIndicationType(gloveWithIndicationType)">
                    <i class="icon-pencil"></i><span class="btn__text">Edit</span>
                  </button>
                </td>
              </ng-container>
              <ng-container *ngIf="gloveWithIndicationTypeAsChanged?.id === gloveWithIndicationType.id">
                <td>{{gloveWithIndicationTypeAsChanged.code}}</td>
                <td>
                  <input type="text" autocomplete="off" class="form-control" [(ngModel)]="gloveWithIndicationTypeAsChanged.name">
                </td>
                <td class="text-end py-2 align-middle">
                  <button class="btn fhi-btn-icon" (click)="updateGloveWithIndicationType(gloveWithIndicationTypeAsChanged)">
                    <i class="icon-pencil"></i><span class="btn__text">Save</span>
                  </button>
                  <button class="btn fhi-btn-icon" (click)="cancelEdit($event)">
                    <i class="icon-x"></i><span class="btn__text">Cancel</span>
                  </button>
                </td>
              </ng-container>
          </tbody>
        </table>
      </div>
    </ng-container>
  </div>
</div>
<div class="row">
  <app-spinner class="col-12" *ngIf="gloveWithIndicationTypes?.length == 0">Loading glove indication types</app-spinner>
</div>
