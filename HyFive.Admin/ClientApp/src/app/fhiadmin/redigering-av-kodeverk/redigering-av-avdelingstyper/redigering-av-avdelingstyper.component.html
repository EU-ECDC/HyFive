<div>
  <div class="row ms-1">
    <div class="col">
      <h5>Avdelingstyper</h5>
    </div>
  </div>
  
  <div class="row ms-1">
    <div class="col-3">
      <input type="text" class="form-control" [(ngModel)]='newDepartmentType.code' placeholder="Kode">
    </div>
    <div class="col-3">
      <input type="text" class="form-control" [(ngModel)]='newDepartmentType.name' placeholder="Navn">
    </div>
    <div class="col-6">
      <label></label>
      <button class="form-control btn fhi-btn-primary" (click)="opprettAvdelingType()" [disabled]="!newDepartmentType.code || !newDepartmentType.name">Legg til</button>
    </div>
  </div>

  <div class="col-12 m-3">
    <ng-container>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Kode</th>
              <th>Navn</th>
              <th class="text-end" scope="col">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let departmentType of departmentTypes">
              <ng-container *ngIf="departmentTypeAsChanged?.id !== departmentType.id">
                <td>{{departmentType.code}}</td>
                <td>{{departmentType.name}}</td>
                <td class="text-end py-2 align-middle">
                  <button class="btn fhi-btn-icon" (click)="valgtAvdelingType(departmentType)">
                    <i class="icon-pencil"></i><span class="btn__text">Edit</span>
                  </button>
                </td>
              </ng-container>
              <ng-container *ngIf="departmentTypeAsChanged?.id === departmentType.id">
                <td>{{departmentTypeAsChanged.code}}</td>
                <td>
                  <input type="text" class="form-control" [(ngModel)]="departmentTypeAsChanged.name">
                </td>
                <td class="text-end py-2 align-middle">
                  <button class="btn fhi-btn-icon" (click)="oppdaterAvdelingType(departmentTypeAsChanged)">
                    <i class="icon-pencil"></i><span class="btn__text">Save</span>
                  </button>
                  <button class="btn fhi-btn-icon" (click)="cancelEdit($event)">
                    <i class="icon-x"></i><span class="btn__text">Cancel</span>
                  </button>
                </td>
              </ng-container>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>
  </div>
</div>
<div class="row">
  <app-spinner class="col-12" *ngIf="departmentTypes?.length == 0">Laster avdelingstyper</app-spinner>
</div>
