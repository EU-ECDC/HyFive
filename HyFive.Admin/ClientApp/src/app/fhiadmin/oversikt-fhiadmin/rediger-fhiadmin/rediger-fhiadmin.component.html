<div class="row">
  <div class="col-12">
    <button class="btn fhi-btn-primary mb-5" (click)="opprettTomFhiAdmin()">Opprett FhiAdmin</button>
  </div>
</div>
<div class="row" *ngIf="brukere">
  <h5 class="col-12">FhiAdmin</h5>
  <label class="col-12" *ngIf="brukere.length === 0 && !nyFhiAdmin">Fant ingen FhiAdmin-brukere</label>
  
  <ng-container>
    <div class="table-responsive">
      <table class="table" *ngIf="brukere.length > 0 || nyFhiAdmin">
        <thead>
          <tr>
            <th scope="col">Firstname</th>
            <th scope="col">Lastname</th>
            <th scope="col">Pseudonym</th>
            <th scope="col">Deaktivert</th>
            <th scope="col">Opprettet tidspunkt</th>
            <th class="text-end" scope="col">Handling</th>
          </tr>
        </thead>
  
        <tbody>
          <tr *ngIf="nyFhiAdmin != null">
            <td><input type="text" class="form-control" [(ngModel)]="nyFhiAdmin.firstName" name="firstName" placeholder="Firstname"></td>
            <td><input type="text" class="form-control" [(ngModel)]="nyFhiAdmin.lastName" name="lastName" placeholder="Lastname"></td>
            <td><input type="text" class="form-control" [(ngModel)]="nyFhiAdmin.identityPseudonym" name="identityPseudonym" placeholder="IdentPseudonym"></td>
            <td></td>
            <td></td>

            <td class="text-end py-0 align-middle">
              <button class="btn fhi-btn-icon" type="button" [disabled]="kanOpprettes() == false" (click)="createFhiAdmin()">
                <i class="icon-plus"></i><span class="btn__text">Opprett</span>
              </button>
              <button class="btn fhi-btn-icon" type="button" (click)="avbrytRedigering($event)">
                <i class="icon-x"></i><span class="btn__text">Avbryt</span>
              </button>
            </td>
          </tr>

          <tr *ngFor="let fhiAdmin of brukere; index as i">
            <ng-container *ngIf="fhiAdminSomEndres?.id != fhiAdmin.id">
              <td>{{ fhiAdmin.firstName }}</td>
              <td>{{ fhiAdmin.lastName }}</td>
              <td>{{ fhiAdmin.identityPseudonym }}</td>
              <td><input type="checkbox" class="form-check-input" [(ngModel)]="fhiAdmin.isDisabled" name="isDisabled" disabled="disabled"></td>
            </ng-container>
            <ng-container *ngIf="fhiAdminSomEndres?.id == fhiAdmin.id">
              <td><input type="text" class="form-control" [(ngModel)]="fhiAdminSomEndres.firstName" name="firstName" placeholder="Firstname"></td>
              <td><input type="text" class="form-control" [(ngModel)]="fhiAdminSomEndres.lastName" name="lastName" placeholder="Lastname"></td>
              <td><input type="text" class="form-control" [(ngModel)]="fhiAdminSomEndres.identityPseudonym" name="identityPseudonym" placeholder="IdentPseudonym"></td>
              <td><input type="checkbox" class="form-check-input" [(ngModel)]="fhiAdminSomEndres.isDisabled" name="isDisabled"></td>
            </ng-container>

            <td>{{ fhiAdmin.timeOfCreation | date:'medium' }}</td>
          
            <td class="text-end py-0 align-middle">
              <ng-container *ngIf="fhiAdmin.id == fhiAdminSomEndres?.id">
                <button class="btn fhi-btn-icon" (click)="updateFhiAdmin(fhiAdminSomEndres)" [disabled]="kanEndres(fhiAdminSomEndres) == false">
                  <i class="icon-pencil"></i><span class="btn__text">Lagre</span>
                </button>
                <button class="btn fhi-btn-icon" (click)="avbrytRedigering($event)">
                  <i class="icon-x"></i><span class="btn__text">Avbryt</span>
                </button>
              </ng-container>

              <ng-container *ngIf="fhiAdmin.id != fhiAdminSomEndres?.id">
                <button class="btn fhi-btn-icon" type="button" (click)="setFhiAdminSomEndres(fhiAdmin)">
                  <i class="icon-pencil"></i><span class="btn__text">Rediger</span>
                </button>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </ng-container>
</div>
