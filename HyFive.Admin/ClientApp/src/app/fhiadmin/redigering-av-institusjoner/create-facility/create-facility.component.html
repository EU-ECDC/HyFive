<div class="row" *ngIf="newfacility">
  <div class="col-12">
    <div class="row mb-1">
      <div class="col-md-6">
        <label for="facilityName" class="mb-1">Name</label>
        <input type="text" autocomplete="off" id="facilityName" class="form-control" placeholder="e.g. Oslo University Hospital HF" (keypress)="omitSpecialChar($event)" [(ngModel)]="newfacility.facilityName">
      </div>
      <div class="col-md-2">
        <label for="abbreviation" class="mb-1">Short Name</label>
        <input type="text" autocomplete="off" id="abbreviation" class="form-control" placeholder="e.g. OUS" (keypress)="omitSpecialChar($event)" [(ngModel)]="newfacility.abbreviation">
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="facilitytype" class="mb-1">Facility Type</label>
        <ng-select
          [searchable]="false"
          [clearable]="false"
          [items]="facilityTypes"
          bindLabel="name"
          bindValue="id"
          [(ngModel)]="newfacility.facilityTypeId"
          (ngModelChange)="showHealthcareOrRegion(newfacility.facilityTypeId)"
          >
        </ng-select>
      </div>
      <div class="col-md-6">
        <label for="city" class="mb-1">City</label>
        <ng-select
          [searchable]="false"
          [clearable]="false"
          [items]="listOfHealthcareOrganizations"
          bindLabel="name"
          bindValue="id"
          [(ngModel)]="newfacility.healthcareOrganizationId"
          >
        </ng-select>
      </div>
    </div>
    <div class="row mb-2">
      <h5 class="col-12">Coordinator</h5>
      <div class="col-md-3">
        <label for="coordinatorfirstname" class="mb-1">First Name</label>
        <input type="text" autocomplete="off" id="coordinatorfirstname" class="form-control" (keypress)="omitSpecialChar($event)" [(ngModel)]="newfacility.coordinatorFirstName">
      </div>
      <div class="col-md-3">
        <label for="coordinatorLastname" class="mb-1">Last Name</label>
        <input type="text" autocomplete="off" id="coordinatorlastname" class="form-control" (keypress)="omitSpecialChar($event)" [(ngModel)]="newfacility.coordinatorLastName">
      </div>
      <div class="col-md-4">
        <label for="coordinatorEmail" class="mb-1">Email</label>
        <input type="email" id="coordinatorEmail" class="form-control" [(ngModel)]="newfacility.coordinatorEmail" (keypress)="mailValidatorHelper.validateMailCharacters($event)" [maxlength]="2147483647">
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <button class="btn fhi-btn-primary mt-1 w-100" [disabled]="canNotCreateFacility()" (click)="createFacility()">Create Healthcare Facility</button>
      </div>
    </div>

  </div>
