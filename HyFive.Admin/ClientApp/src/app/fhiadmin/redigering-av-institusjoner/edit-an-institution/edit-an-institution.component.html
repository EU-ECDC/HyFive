<div class="container">
  <div class="ml-n3 mb-3">
    <app-navigasjonslenke [routerLink]="'/'+ UrlPaths.editingByInstitutions"> Tilbake til oversikt</app-navigasjonslenke>
    <h4 class="col-12">Institution: {{institution?.name}}</h4>
  </div>
</div>

<app-spinner *ngIf="!institution"></app-spinner>

<div class="container" *ngIf="institution">
  <ul ngbNav #nav="ngbNav" class="nav nav-tabs mt-4 fhi-nav-tabs fhi-main-menu__nav" [(activeId)]="active">
    <li [ngbNavItem]="1" class="fhi-main-menu__nav-item">
      <a class="nav-link fhi-main-menu__nav-link" ngbNavLink>Institution</a>
      <ng-template ngbNavContent>
        <div class="row border-bottom pb-2">
          <div class="col-12">
            <div class="row mb-3">
              <div class="col-md-3">
                <label for="institusjonsnavn">Navn</label>
                <input type="text" id="institusjonsnavn" class="form-control" placeholder="e.g. Oslo Universitetssykehus HF" [(ngModel)]="institution.name">
              </div>
              <div class="col-md-2">
                <label for="forkortelse">Kortnavn</label>
                <input type="text" id="forkortelse" class="form-control" placeholder="e.g. OUS" [(ngModel)]="institution.abbreviation">
              </div>
            </div>
            <div class="row mb-3">
              <div class="col-md-3">
                <label for="institutionType">Institusjonstype</label>
                <select class="form-select" id="institutionType" [(ngModel)]="institusjontypeId" (ngModelChange)="institusjonTypeEndret()">
                  <option *ngFor="let institutionType of institutionTypes" [ngValue]="institutionType.id">{{institutionType.name}}</option>
                </select>
              </div>
              <div class="col-md-2" *ngIf="visKommune">
                <label for="kommune">Municipality</label>
                <select class="form-select" id="kommune" [(ngModel)]="kommuneId" (ngModelChange)="kommuneEndret()">
                  <option value="0"></option>
                  <option *ngFor="let kommune of kommuner" [ngValue]="kommune.id">{{kommune.name}}</option>
                </select>
              </div>
              <div class="form-group col-12 col-md-3" *ngIf="visHelseforetak">
                <label for="helseforetak">HealthcareEnterprise</label>
                <select class="form-select" id="helseforetak" [(ngModel)]="helseforetakId" (ngModelChange)="helseforetakEndret()">
                  <option value="0"></option>
                  <option *ngFor="let helseforetak of listOfHealthcareEnterprises" [ngValue]="helseforetak.id">{{helseforetak.name}}</option>
                </select>
              </div>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-md-2">
              <button (click)="lagreInstitusjon()" class="btn fhi-btn-primary" [disabled]="kanIkkeLagreInstitusjon()">Oppdater institution</button>
            </div>
            <div class="col-md-2">
              <app-confirmation-dialog
                [buttonClass]="'btn fhi-btn-secondary'"
                [buttonText]="'Slett institution'"
                (confirmEvent)="deleteInstitution()"
                [dialogMessage]="'Sletting av institusjonen medfører at alle data som er knyttet til institusjonen slettes. Vil du slette?'">
              </app-confirmation-dialog>
            </div>
          </div>
        </div>
      </ng-template>
    </li>
    <li [ngbNavItem]="2" class="fhi-main-menu__nav-item">
      <a class="nav-link fhi-main-menu__nav-link" ngbNavLink>Koordinatorer</a>
      <ng-template ngbNavContent>
        <div class="border-bottom">
          <app-edit-coordinators [institutionId]="institutionId"></app-edit-coordinators>
        </div>
      </ng-template>
    </li>
    <li [ngbNavItem]="3" class="fhi-main-menu__nav-item">
      <a class="nav-link fhi-main-menu__nav-link" ngbNavLink>Observers</a>
      <ng-template ngbNavContent>
        <div class="border-bottom">
          <app-edit-observers [institutionId]="institutionId"></app-edit-observers>
        </div>
      </ng-template>
    </li>
    <li [ngbNavItem]="4" class="fhi-main-menu__nav-item">
      <a class="nav-link fhi-main-menu__nav-link" ngbNavLink>Avdelinger</a>
      <ng-template ngbNavContent>
        <app-editing-of-departments [institutionId]="institutionId"></app-editing-of-departments>
      </ng-template>
    </li>
  </ul>
  <div [ngbNavOutlet]="nav" class="mt-5"></div>
</div>
