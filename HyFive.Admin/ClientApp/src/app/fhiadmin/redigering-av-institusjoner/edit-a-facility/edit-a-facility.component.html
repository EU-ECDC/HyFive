<div class="container">
  <div class="ml-n3 mb-3">
    <app-navigation-bar [routerLink]="'/'+ UrlPaths.editingByFacilities"> Back to overview</app-navigation-bar>
    <h4 class="col-12">Facility: {{facility?.name}}</h4>
  </div>
</div>

<app-spinner *ngIf="!facility"></app-spinner>

<div class="container" *ngIf="facility">
  <ul ngbNav #nav="ngbNav" class="nav nav-tabs mt-4 fhi-nav-tabs fhi-main-menu__nav" [(activeId)]="active">
    <li [ngbNavItem]="1" class="fhi-main-menu__nav-item">
      <a class="nav-link fhi-main-menu__nav-link" ngbNavLink>Facility</a>
      <ng-template ngbNavContent>
        <div class="row border-bottom pb-2">
          <div class="col-12">
            <div class="row mb-3">
              <div class="col-md-3">
                <label for="facilityName">Name</label>
                <input type="text" autocomplete="off" id="facilityName" class="form-control" placeholder="e.g. Oslo University Hospital HF" (keypress)="omitSpecialChar($event)" [(ngModel)]="facility.name" (ngModelChange)="facility.name = $event.trim()">
              </div>
              <div class="col-md-2">
                <label for="abbreviation">Short Name</label>
                <input type="text" autocomplete="off" id="abbreviation" class="form-control" placeholder="e.g. OUS" (keypress)="omitSpecialChar($event)" [(ngModel)]="facility.abbreviation" (ngModelChange)="facility.abbreviation = $event.trim()">
              </div>
            </div>
            <div class="row mb-3">
              <div class="col-md-3">
                <label for="facilityType">Facility Type</label>
                <ng-select
                  [searchable]="false"
                  [clearable]="false"
                  [items]="facilityTypes"
                  bindLabel="name"
                  bindValue="id"
                  [(ngModel)]="facilitytypeId"
                  (ngModelChange)="facilityTypeChanged()"
                  >
                </ng-select>
              </div>
              <div class="form-group col-12 col-md-3">
                <label for="city">City</label>
                <ng-select
                  [searchable]="false"
                  [clearable]="false"
                  [items]="listOfCities"
                  bindLabel="name"
                  bindValue="id"
                  [(ngModel)]="cityId"
                  (ngModelChange)="cityChanged()"
                  >
                </ng-select>
              </div>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-md-4">
              <button (click)="saveFacility()" class="btn fhi-btn-primary" [disabled]="canNotSavefacility()">Update healthcare facility</button>
            </div>
            <div class="col-md-4">
              <app-confirmation-dialog
                [buttonClass]="'btn fhi-btn-secondary'"
                [buttonText]="'Delete healthcare facility'"
                (confirmEvent)="deleteFacility()"
                [dialogMessage]="'Deleting the facility means that all data associated with the facility will be deleted. Do you want to delete?'">
              </app-confirmation-dialog>
            </div>
          </div>
        </div>
      </ng-template>
    </li>
    <li [ngbNavItem]="2" class="fhi-main-menu__nav-item">
      <a class="nav-link fhi-main-menu__nav-link" ngbNavLink>Coordinators</a>
      <ng-template ngbNavContent>
        <div class="border-bottom">
          <app-edit-coordinators [facilityId]="facilityId"></app-edit-coordinators>
        </div>
      </ng-template>
    </li>
    <li [ngbNavItem]="3" class="fhi-main-menu__nav-item">
      <a class="nav-link fhi-main-menu__nav-link" ngbNavLink>Observers</a>
      <ng-template ngbNavContent>
        <div class="border-bottom">
          <app-edit-observers [facilityId]="facilityId"></app-edit-observers>
        </div>
      </ng-template>
    </li>
    <li [ngbNavItem]="4" class="fhi-main-menu__nav-item">
      <a class="nav-link fhi-main-menu__nav-link" ngbNavLink>Departments</a>
      <ng-template ngbNavContent>
        <app-editing-of-departments [facilityId]="facilityId"></app-editing-of-departments>
      </ng-template>
    </li>
  </ul>
  <div [ngbNavOutlet]="nav" class="mt-5"></div>
</div>
