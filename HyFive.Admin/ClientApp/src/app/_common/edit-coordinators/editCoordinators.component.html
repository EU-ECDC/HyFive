<div class="row">
  <div class="col-12">
    <button class="btn fhi-btn-primary mb-5 mt-3" (click)="createEmptyCoordinator()">Create coordinator</button>
  </div>
</div>
<div class="row" *ngIf="coordinators">
  <input type="text" autocomplete="off" *ngIf="coordinators.length > 0" placeholder="Search for...(First name/Last name)" autofocus="" class="form-control fhi-form__form-control my-3 ms-3" style="width: 400px;" [(ngModel)]="searchWord" (ngModelChange)="filterCoordinators()">
  <label class="col-12" *ngIf="coordinators.length === 0 && !newCoordinator">No coordinators found at this facility</label>
  
  <ng-container>
    <div class="table-responsive">
      <table class="table" *ngIf="coordinators.length > 0 || newCoordinator" sortable-table (sorted)="sorting($event)">
        <thead>
          <tr>
            <th sortable-column="First name"></th>
            <th sortable-column="Last name"></th>
            <th>Email</th>
            <th>Disabled</th>
            <th class="text-end" scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="newCoordinator != null">
            <td><input type="text" autocomplete="off" class="form-control" [(ngModel)]="newCoordinator.firstName" (keypress)="omitSpecialChar($event)" name="firstName" placeholder="First name"></td>
            <td><input type="text" autocomplete="off" class="form-control" [(ngModel)]="newCoordinator.lastName" (keypress)="omitSpecialChar($event)" name="lastName" placeholder="Last name"></td>
            <td><input type="email" class="form-control" [(ngModel)]="newCoordinator.email" name="email" (keypress)="mailValidatorHelper.validateMailCharacters($event)" placeholder="Email"></td>
            <td></td>
            <td class="text-end py-2 align-middle">
              <button class="btn fhi-btn-icon" [disabled]="canBeCreated() == false" (click)="createCoordinator()">
                <i class="icon-plus"></i><span class="btn__text">Create</span>
              </button>
              <button class="my-2 btn fhi-btn-icon" (click)="cancelEdit($event)">
                <i class="icon-x"></i><span class="btn__text">Cancel</span>
              </button>
            </td>
          </tr>
  
          <tr *ngFor="let coordinator of filteredCoordinators">
            <ng-container *ngIf="coordinatorIsChanged?.id != coordinator.id">
              <td>{{coordinator.firstName}}</td>
              <td>{{coordinator.lastName}} </td>
              <td>{{coordinator.email}}</td>
              <td>
                <input type="checkbox" class="form-check-input" [(ngModel)]="coordinator.isDisabled" name="isDisabled" disabled="disabled">
              </td>
              
              <td class="text-end py-2 align-middle">
                <button class="btn fhi-btn-icon" (click)="setCoordinatorAsChanged(coordinator)">
                  <i class="icon-pencil"></i><span class="btn__text">Edit</span>
                </button>
              </td>
            
            </ng-container>
            <ng-container *ngIf="coordinatorIsChanged?.id == coordinator.id">
              <td>
                <input type="text" autocomplete="off" class="form-control" [(ngModel)]="coordinatorIsChanged.firstName" (keypress)="omitSpecialChar($event)" name="firstName" placeholder="First name">
              </td>
              <td>
                <input type="text" autocomplete="off" class="form-control" [(ngModel)]="coordinatorIsChanged.lastName" (keypress)="omitSpecialChar($event)" name="lastName" placeholder="Last name">
              </td>
              <td>
                <input type="email" class="form-control" [(ngModel)]="coordinatorIsChanged.email" name="email" (keypress)="mailValidatorHelper.validateMailCharacters($event)" placeholder="Email">
              </td>

              <td>
                <input type="checkbox" class="form-check-input" [(ngModel)]="coordinatorIsChanged.isDisabled" name="isDisabled">
              </td>

              <td class="text-end py-2 align-middle">
                <ng-container *ngIf="coordinator.id == coordinatorIsChanged?.id">
                  <button class="btn fhi-btn-icon mr-2 w-100"
                          (click)="updateCoordinator(coordinatorIsChanged)"
                          [disabled]="canbeChanged(coordinatorIsChanged) == false">
                          <i class="icon-pencil"></i><span class="btn__text">Save</span>
                  </button>
                  <div *ngIf="canDelete">
                    <app-confirmation-dialog 
                                                  [buttonText]="'Delete'"
                                                  (confirmEvent)="deleteCoordinator(coordinator)"
                                                  [dialogMessage]='"Do you want to delete " + coordinator.firstName + " " + coordinator.lastName + "?"'
                                                  [buttonClass]="'mt-2 btn fhi-btn-icon w-100'"
                                                  [shouldUseIcon]=true>
                    </app-confirmation-dialog>
                  </div>
    
                  <button class="my-2 btn fhi-btn-icon w-100" (click)="cancelEdit($event)">
                    <i class="icon-x"></i><span class="btn__text">Cancel</span>
                  </button>
                </ng-container>
              </td>

            </ng-container>
          </tr>
        </tbody>
      </table>  
    </div>
      </ng-container>
</div>
