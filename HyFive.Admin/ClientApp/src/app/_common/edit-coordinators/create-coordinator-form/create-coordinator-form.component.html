<div class="row col-12 mb-3">

    <div class="form-group col-3">
        <label for="firstName">{{"First Name" | translate }}</label>
        <input type="text" autocomplete="off" class="form-control" id="firstName" [(ngModel)]="newCoordinator.firstName" (ngModelChange)="newCoordinator.firstName = $event.trim()" (keypress)="omitSpecialChar($event)" name="firstName" [placeholder]="'First Name' | translate">  
    </div>
    <div class="form-group col-3">
        <label for="lastName">{{"Last Name" | translate }}</label>
        <input type="text" autocomplete="off" class="form-control" [(ngModel)]="newCoordinator.lastName" (ngModelChange)="newCoordinator.lastName = $event.trim()" (keypress)="omitSpecialChar($event)" id="lastName" name="lastName" [placeholder]="'Last Name' | translate">
    </div>
    <div class="form-group col-5">
        <label for="email">{{"Email" | translate }}</label>
        <input type="email" class="form-control" [(ngModel)]="newCoordinator.email" id="email" name="email" (keypress)="mailValidatorHelper.validateMailCharacters($event)" [placeholder]="'Email' | translate">
    </div>
</div>

<div class="row">
  <div class="col-md-3">
    <button class="btn fhi-btn-primary w-100 mt-1" [disabled]="canBeCreated() == false" (click)="createCoordinator()">{{"Save" | translate}}</button>
  </div>
  <div class="col-md-3">
    <button class="btn fhi-btn-secondary mt-1 me-3"
            (click)="cancelEdit()">
      {{ "Cancel" | translate }}
    </button>
</div>
</div>
