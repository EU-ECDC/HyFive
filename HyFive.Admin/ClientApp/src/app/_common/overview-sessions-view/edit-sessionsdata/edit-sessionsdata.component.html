
<div>
  <label for="comment" class="form-label"><b>{{"comment" | translate }}: </b></label>
  <span *ngIf="!editingMode">{{session.comment}}</span>
  <textarea id="comment" class="form-control" [(ngModel)]="sessionCopy.comment" (ngModelChange)="hasChangedComment = true" *ngIf="editingMode"></textarea>
</div>

<button class="btn fhi-btn-secondary" *ngIf="!editingMode && canEdit" (click)="editingMode = true">{{"edit comment" | translate }}</button>

<ng-container *ngIf="editingMode">
  <div class="mt-3">
    <button class="btn fhi-btn-primary me-2" [disabled]="!canSave()" (click)="save()" >{{"Save" | translate }}</button>
    <button class="btn fhi-btn-secondary" (click)="resetState()">{{"Cancel" | translate }}</button>
  </div>

</ng-container>
